name: Deploy Toxic Turf Shield Generator

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Google Sheets Webhook Secret
        run: |
          # Replace the __APPS_SCRIPT_URL__ placeholder in index.html with the GitHub secret
          sed -i 's|__APPS_SCRIPT_URL__|${{ secrets.APPS_SCRIPT_URL }}|g' index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
