name: Deploy Toxic Turf Shield Generator

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Google Sheets secret into HTML
        env:
          URL_SECRET: ${{ secrets.APPS_SCRIPT_URL }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'index.html';
          let content = fs.readFileSync(path, 'utf8');
          const placeholder = 'const APPS_SCRIPT_URL = "__APPS_SCRIPT_URL__";';
          const secret = process.env.URL_SECRET || '';

          if (!secret) {
            console.warn('WARN: APPS_SCRIPT_URL no está definida. Se dejará vacía para que la página no falle.');
            content = content.replace(placeholder, 'const APPS_SCRIPT_URL = "";');
          } else {
            const safe = JSON.stringify(secret);
            content = content.replace(placeholder, `const APPS_SCRIPT_URL = ${safe};`);
          }

          fs.writeFileSync(path, content, 'utf8');
          console.log('APPS_SCRIPT_URL inyectado correctamente (o dejado vacío si no existe).');
          NODE

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true
          publish_branch: gh-pages
