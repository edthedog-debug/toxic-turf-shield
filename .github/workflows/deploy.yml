name: Deploy Toxic Turf Shield Generator

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Google Sheets Webhook Secret
        env:
          URL_SECRET: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          node -e '
            const fs = require("fs");
            let content = fs.readFileSync("index.html", "utf8");
            const secret = process.env.URL_SECRET;
            if (!secret) {
              console.error("ERROR: APPS_SCRIPT_URL secret is not set in GitHub repository settings!");
              process.exit(1);
            }
            // Reemplaza todas las instancias de __APPS_SCRIPT_URL__ por la URL del secret
            content = content.replaceAll("__APPS_SCRIPT_URL__", secret);
            fs.writeFileSync("index.html", content, "utf8");
            console.log("APPS_SCRIPT_URL injected successfully.");
          '

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
